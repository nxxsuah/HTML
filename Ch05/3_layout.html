<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3_layout</title>

        <style>

     * {
            margin: 0;
            padding: 0;
            font: normal 12px '돋움';
        }

        ul, ol { list-style: none; }
        a {text-decoration: none; color: #111;}
        input, textarea {outline: none;}

        #container {
            width: 800px;
            min-height: 1100px;
            padding: 10px;
            border: 1px solid black;
            box-sizing: border-box;

        }

        header {
            width: 100%;
            height: 120px;
            padding : 10px;     
            margin: 10px 0;  
            background: #e4e4e4;
            border: 1px dashed black;
            box-sizing: border-box;            
        }

        main {
            width: 800px;
            height: auto;      
            margin: 10px 10px;
            padding: 10px;                
            background: #d8d8d8;
            border: 1px dashed black;
            box-sizing: border-box;        
            }

         section {
            width: 780px;
            min-height: 400px;
            margin: 10px 10px;
            padding: 10px;
            background: #c4c4c4;
            border: 1px dashed black;
            box-sizing: border-box;
            }
            article {
                width: 760px;
                height: 200px;
                margin : 10px;
                background: #afafaf;
                border: 1px dashed black;
                box-sizing: border-box;
            }

         footer {
            width: 800px;
            height: 100px;
            margin-top: 10px;
            margin-left: 10px;
            background: #eee;
            border: 1px dashed black;
            box-sizing: border-box;
        }


        </style>

</head>
<body>
    <div id="container">
        <header>header</header>
            <main>
            main
                <section>
                section #1
                    <article>article #1</article>
                    <article>article #2</article>
                </section>

                <section>
                section #2
                    <article>article #1</article>
                    <article>article #2</article>
                </section>
            </main>
        <footer>footer</footer>
    </div>
</body>
</html>
